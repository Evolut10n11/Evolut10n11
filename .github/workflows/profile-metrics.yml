name: Generate profile metrics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/generate_profile_metrics.py"
      - ".github/workflows/profile-metrics.yml"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "scripts/generate_profile_metrics.py"
      - ".github/workflows/profile-metrics.yml"
      - "README.md"
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate self-hosted GitHub cards
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_profile_metrics.py

      - name: Commit metrics when changed
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git add assets/metrics
          if git diff --cached --quiet; then
            echo "Profile metrics are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile metrics"
          git push origin HEAD:main
